name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  LANG: C.UTF-8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Lint local and AI translations
        run: pnpm run pipeline:lint

      - name: Build production and recon userscripts
        run: |
          pnpm run build
          pnpm run build:recon
